<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NexGen Client Demo</title>
<style>
:root{--bg:#EDF0F1;--surface:#fff;--line:#D3DADD;--ink:#16242C;--muted:#55666F;--band:#12303D;--accent:#0F6E8C;--err:#9A3F0B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A20;--surface:#16232B;--line:#2E424D;--ink:#E8EFF1;--muted:#A0B2BA;--band:#0A2430;--accent:#4FB3D1;--err:#F7B084;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--band);color:#F3F7F8;padding:18px 20px;font-weight:700;font-size:22px;letter-spacing:.04em}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;width:100%;max-width:380px;display:grid;gap:14px}
h1{margin:0;font-size:22px;line-height:1.2}
p{margin:0;color:var(--muted);font-size:14.5px}
label{font-weight:600;font-size:14px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit;letter-spacing:.06em;text-transform:uppercase}
button{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#08202A}}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{color:var(--err);min-height:1.4em}
</style>
</head>
<body>
<header>NexGen</header>
<main>
<form id="f">
<h1>Client demo</h1>
<p>Enter the access code from your NexGen invitation to open the demo.</p>
<div><label for="code">Access code</label><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required></div>
<button id="go" type="submit">Open demo</button>
<p id="msg" role="alert"></p>
</form>
</main>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.trim().toUpperCase()),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(S),iterations:150000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(I)},k,b(D)));
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();const code=document.getElementById("code").value;go.disabled=true;msg.textContent="";
  try{const html=await unlock(code);try{sessionStorage.setItem("nx",code)}catch(_){}show(html)}
  catch(_){msg.textContent="That code didn't work. Check your invitation and try again.";go.disabled=false}
});
(async()=>{let c=null;try{c=sessionStorage.getItem("nx")}catch(_){}if(c){try{show(await unlock(c))}catch(_){}}})();
})();
